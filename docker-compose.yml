services:
  nginx:
    image: nginx:alpine
    container_name: dbdiagram-oss-nginx
    ports:
      - "80:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    
  backend:
    build:
      context: ./backend
    container_name: dbdiagram-oss-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dbdiagram-oss-frontend
    depends_on:
      - backend
    restart: unless-stopped

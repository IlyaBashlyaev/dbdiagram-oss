services:
  backend:
    build:
      context: ./backend
    container_name: dbdiagram-oss-backend
    ports:
      - "8000-9000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dbdiagram-oss-frontend
    ports:
      - "3000-4000:80"
    depends_on:
      - backend
    restart: unless-stopped

  urls:
    image: docker:cli
    container_name: dbdiagram-oss-urls
    profiles: ["tools"]
    environment:
      - COMPOSE_PROJECT_NAME=dbdiagram-oss
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    working_dir: /project
    entrypoint: ["sh", "scripts/urls.sh"]

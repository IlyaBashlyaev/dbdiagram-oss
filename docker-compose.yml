services:
  backend:
    build:
      context: ./backend
    container_name: dbdiagram-oss-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dbdiagram-oss-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
